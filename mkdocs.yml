site_name: Sanctions & Export Controls — AI, Advanced Computing & Oil/Energy
site_description: >
  Curated resource on US export controls (EAR/BIS) and OFAC sanctions as applied
  to artificial intelligence, advanced computing, and the oil/energy sector.
site_author: Felipe Villasuso Lago
site_url: https://felipelago17.github.io/Sanctions-and-Export-Controls-AI-and-Oil/

repo_name: felipelago17/Sanctions-and-Export-Controls-AI-and-Oil
repo_url: https://github.com/felipelago17/Sanctions-and-Export-Controls-AI-and-Oil
edit_uri: ""

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

