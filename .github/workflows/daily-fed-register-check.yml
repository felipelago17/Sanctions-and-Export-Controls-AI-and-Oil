name: Daily Federal Register Check

on:
  schedule:
    - cron: '0 6 * * *'  # 6:00 AM UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fed-register-check
  cancel-in-progress: false

jobs:
  check-federal-register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Query Federal Register API
        id: fr_query
        run: |
          python - <<'PYEOF'
          import requests, json, datetime, os, sys

          TODAY = datetime.date.today()
          YESTERDAY = TODAY - datetime.timedelta(days=1)
          HEADERS = {"User-Agent": "export-controls-monitor/1.0 (+https://github.com/felipelago17/Sanctions-and-Export-Controls-AI-and-Oil)"}

          KEYWORDS = [
              "export control", "ECCN", "deemed export", "foreign national", "cybersecurity",
              "artificial intelligence", "sanctions", "OFAC", "IEEPA", "Entity List",
              "intrusion", "supply chain", "access control", "distillation", "model weights",
              "advanced computing", "semiconductor", "bureau of industry", "BIS "
          ]

          AGENCY_SLUGS = [
              "bureau-of-industry-and-security",
              "office-of-foreign-assets-control"
          ]

          results = []

          # Federal Register API
          for agency in AGENCY_SLUGS:
              url = (
                  "https://www.federalregister.gov/api/v1/documents.json"
                  f"?fields[]=title&fields[]=html_url&fields[]=publication_date&fields[]=abstract"
                  f"&order=newest&per_page=20"
                  f"&agencies[]={agency}"
                  f"&conditions[publication_date][gte]={YESTERDAY}"
              )
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  r.raise_for_status()
                  docs = r.json().get("results", [])
                  for doc in docs:
                      title = doc.get("title", "")
                      abstract = doc.get("abstract", "") or ""
                      combined = (title + " " + abstract).lower()
                      if any(kw.lower() in combined for kw in KEYWORDS):
                          results.append({
                              "title": title,
                              "url": doc.get("html_url", ""),
                              "date": doc.get("publication_date", ""),
                              "agency": agency,
                              "abstract": abstract[:300]
                          })
              except Exception as e:
                  print(f"Error querying {agency}: {e}", file=sys.stderr)

          print(f"Found {len(results)} relevant documents")
          with open("fr_results.json", "w") as f:
              json.dump(results, f, indent=2)
          PYEOF

      - name: Create GitHub Issues for new regulations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import json, subprocess, sys

          try:
              with open("fr_results.json") as f:
                  results = json.load(f)
          except FileNotFoundError:
              print("No results file found")
              sys.exit(0)

          if not results:
              print("No new relevant Federal Register documents today")
              sys.exit(0)

          for doc in results[:5]:  # Cap at 5 issues per run
              title = f"[FR] {doc['title'][:80]}"
              body = (
                  f"**Federal Register Document**\n\n"
                  f"**Date:** {doc['date']}\n"
                  f"**Agency:** {doc['agency']}\n"
                  f"**URL:** {doc['url']}\n\n"
                  f"**Abstract:**\n{doc.get('abstract', 'N/A')}\n\n"
                  f"---\n*Auto-generated by daily-fed-register-check.yml*"
              )
              cmd = [
                  "gh", "issue", "create",
                  "--title", title,
                  "--body", body,
                  "--label", "federal-register,regulatory-update"
              ]
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  print(f"Failed to create issue: {result.stderr}", file=sys.stderr)
              else:
                  print(f"Created issue: {title}")
          PYEOF

      - name: Update regulatory calendar
        run: |
          python - <<'PYEOF'
          import json, datetime

          try:
              with open("fr_results.json") as f:
                  results = json.load(f)
          except FileNotFoundError:
              results = []

          cal_path = "07_Regulatory-Monitoring/regulatory-calendar.json"
          try:
              with open(cal_path) as f:
                  calendar = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              calendar = []

          for doc in results:
              entry = {
                  "event_id": f"FR-{doc['date']}-{hash(doc['url']) % 10000:04d}",
                  "date": doc["date"],
                  "event_name": doc["title"],
                  "jurisdiction": "US",
                  "regulation": "Federal Register",
                  "status": "Final rule",
                  "enforcement_likelihood": "Medium",
                  "impact_assessment": doc.get("abstract", "")[:200],
                  "tracking_url": doc["url"],
                  "topics": ["EAR", "OFAC"]
              }
              existing_urls = {e.get("tracking_url") for e in calendar}
              if doc["url"] not in existing_urls:
                  calendar.append(entry)

          with open(cal_path, "w") as f:
              json.dump(calendar, f, indent=2)
          print(f"Regulatory calendar updated: {len(calendar)} entries")
          PYEOF

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 07_Regulatory-Monitoring/regulatory-calendar.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: FR regulatory calendar update $(date -u +%Y-%m-%d)"
          git push
