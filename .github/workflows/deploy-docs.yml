name: Deploy Documentation to Public Site

# Deploys MkDocs site to the gh-pages branch of this repository using
# the built-in GITHUB_TOKEN — no external secret required.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Daily Digest Update"
      - "Weekly Digest Update"
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and plugins
        run: |
          pip install \
            mkdocs-material \
            pymdown-extensions

      - name: Configure git identity for gh-deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: mkdocs gh-deploy --force
